<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Detector de Fake News</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f5f9ff;
      --accent:#6ec1ff;
      --accent-soft:#e6f3ff;
      --text:#000;
      --ok:#2ecc71;
      --bad:#e74c3c;
      --glow-ok:0 0 25px rgba(46,204,113,.8);
      --glow-bad:0 0 25px rgba(231,76,60,.8);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:'Press Start 2P', monospace;
      background:var(--bg);
      color:var(--text);
      display:flex;
      justify-content:center;
      min-height:100vh;
    }

    /* CONTENEDOR GENERAL */
    .screen{
      width:100%;
      max-width:1920px;
      padding:16px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:var(--accent-soft);
      padding:14px;
      border-radius:14px;
      font-size:12px;
    }

    .stage{
      display:flex;
      gap:16px;
      margin-top:16px;
      width:100%;
    }

    .play{
      position:relative;
      flex:1;
      background:#fff;
      border:3px solid var(--accent);
      border-radius:18px;
      min-height:500px;
      padding:16px;
    }

    .headline{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      border:3px solid var(--accent);
      border-radius:16px;
      padding:22px;
      text-align:center;
      width:85%;
      background:#fff;
      font-size:15px;
      line-height:1.6;
      transition:.2s;
    }

    .timer{
      height:10px;
      margin-top:14px;
      background:#eee;
      border-radius:6px;
      overflow:hidden;
    }

    .timer i{
      display:block;
      height:100%;
      background:linear-gradient(90deg,var(--accent),#0047ab);
    }

    .panel{
      width:340px;
      border:3px solid var(--accent);
      border-radius:18px;
      padding:18px;
      background:#fff;
      font-size:11px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    button{
      font-family:'Press Start 2P', monospace;
      padding:16px;
      border:none;
      border-radius:16px;
      width:100%;
      cursor:pointer;
      background:var(--accent);
      color:#fff;
    }

    .fakeBtn{background:var(--bad)}

    .overlay{
      position:absolute;
      inset:0;
      background:#ffffffee;
      border:3px solid var(--accent);
      border-radius:18px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
    }

    .overlay .title{font-size:20px;margin-bottom:14px}

    #tipText{font-size:12px}

    footer{
      margin-top:14px;
      text-align:center;
      font-size:9px;
    }

    /* ===================== */
    /*  PC – 21:9 / Full HD  */
    /* ===================== */
    @media (min-width:1280px) and (min-aspect-ratio:21/9){
      .screen{max-width:1920px}
      .play{min-height:560px}
      .headline{font-size:16px;width:70%}
      .panel{width:360px;font-size:12px}
    }

    /* ===================== */
    /*  CELULAR – 9:16      */
    /* ===================== */
    @media (max-width:720px) and (max-aspect-ratio:9/16){
      header{
        flex-direction:column;
        gap:8px;
        text-align:center;
        font-size:10px;
      }

      .stage{
        flex-direction:column;
      }

      .play{
        min-height:360px;
      }

      .headline{
        font-size:12px;
        width:92%;
        padding:16px;
        line-height:1.4;
      }

      .panel{
        width:100%;
        font-size:10px;
      }

      button{
        padding:14px;
        font-size:10px;
      }
    }

    /* ===================== */
    /*  ROTACIÓN DE CELU    */
    /* ===================== */
    @media (max-width:900px) and (orientation:landscape){
      .stage{flex-direction:row}
      .panel{width:280px}
      .headline{font-size:12px}
    }
  </style>
</head>
<body>
<div class="screen">
  <header>
    <div>DETECTOR DE FAKE NEWS</div>
    <div>PUNTAJE ▶ <span id="score">0</span></div>
  </header>

  <div class="stage">
    <div class="play" id="play">
      <div class="headline" id="headlineBox">
        <div id="headlineText">TOCÁ EMPEZAR</div>
        <div class="timer"><i id="bar"></i></div>
      </div>

      <div class="overlay" id="startOverlay">
        <div class="title">¿LIST@?</div>
        <div>FAKE o VERIFICADO</div>
        <button id="startBtn">EMPEZAR</button>
      </div>

      <div class="overlay" id="loseOverlay" style="display:none">
        <div class="title">SEÑAL PERDIDA</div>
        <div>Puntaje: <span id="finalScore">0</span></div>
        <button id="retryBtn">REINTENTAR</button>
      </div>
    </div>

    <div class="panel">
      <div><strong>Velocidad</strong></div>
      <div id="levelText">Nivel 1 — 10s</div>
      <button class="fakeBtn" id="btnFake">FAKE</button>
      <button id="btnReal">VERIFICADO</button>
      <div>Tip:</div>
      <div id="tipText">—</div>
    </div>
  </div>

  <footer>
    Juego creado por <a href="https://www.linkedin.com/in/sarah-lee-olivera-a15822346/" target="_blank">Sarah Lee Olivera</a> · grafica@ccomusoc.com.ar
  </footer>
</div>

<script>
  const realSamplesBase=[
    'El CONICET alerta sobre desinformación en redes',
    'Universidades lanzan cursos de fact-checking',
    'Informe internacional advierte sobre deepfakes',
    'Escuelas incorporan alfabetización mediática',
    'Periodistas crean red de verificación'
  ];
  const realSamples=Array.from({length:200},(_,i)=>realSamplesBase[i%realSamplesBase.length]+` (#${i+1})`);
  const fakeSamplesBase=[
    'Una app permite leer la mente con el celular',
    'Tomar mate cura todas las enfermedades',
    'El WiFi controla los sueños',
    'La luna será privatizada en 2027',
    'Caminar hacia atrás rejuvenece'
  ];
  const fakeSamples=Array.from({length:200},(_,i)=>fakeSamplesBase[i%fakeSamplesBase.length]+` (#${i+1})`);
  const tips=[
    'Chequeá la fuente',
    'Desconfiá de títulos exagerados',
    'Buscá la noticia en otros medios',
    'Verificá fecha y autor'
  ];

  const headlines=Array.from({length:400},()=>{
    const isReal=Math.random()>0.5;
    return{
      text:isReal?realSamples[Math.floor(Math.random()*realSamples.length)]:fakeSamples[Math.floor(Math.random()*fakeSamples.length)],
      isReal
    };
  });

  let score=0,streak=0,level=1,time=10,current=null,timer=null;
  const hText=document.getElementById('headlineText');
  const bar=document.getElementById('bar');
  const scoreEl=document.getElementById('score');
  const levelEl=document.getElementById('levelText');
  const tipEl=document.getElementById('tipText');

  const sndOk=new Audio('https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3');
  const sndBad=new Audio('https://assets.mixkit.co/active_storage/sfx/950/950-preview.mp3');
  sndOk.volume=0.25;
  sndBad.volume=0.25;
  const music=new Audio('https://assets.mixkit.co/active_storage/sfx/1447/1447-preview.mp3');
  music.loop=true;music.volume=0.3;

  function pick(){return headlines[Math.floor(Math.random()*headlines.length)]}

  function show(){
    current=pick();
    hText.textContent=current.text;
    bar.style.width='100%';
    bar.style.transition='none';
    void bar.offsetWidth;
    bar.style.transition=`width ${time}s linear`;
    bar.style.width='0%';
    clearTimeout(timer);
    timer=setTimeout(lose,time*1000);
  }

  function flash(ok){
    const box=document.getElementById('headlineBox');
    box.style.boxShadow=ok?'var(--glow-ok)':'var(--glow-bad)';
    box.style.borderColor=ok?'var(--ok)':'var(--bad)';
    setTimeout(()=>{box.style.boxShadow='';box.style.borderColor='var(--accent)'},350);
  }

  function answer(r){
    if(!current)return;
    clearTimeout(timer);
    if(r===current.isReal){
      sndOk.play();
      flash(true);
      score++;streak++;
      scoreEl.textContent=score;
      if(streak%5===0) tipEl.textContent=tips[(Math.floor(streak/5)-1)%tips.length];
      if(streak%10===0){
        level++;
        time=Math.max(3,time-1);
        levelEl.textContent=`Nivel ${level} — ${time}s`;
      }
      show();
    }else{
      sndBad.play();
      flash(false);
      setTimeout(lose,300);
    }
  }

  function lose(){
    document.getElementById('finalScore').textContent=score;
    document.getElementById('loseOverlay').style.display='flex';
  }

  function start(){
    music.play();
    score=0;streak=0;level=1;time=10;
    scoreEl.textContent=0;
    levelEl.textContent='Nivel 1 — 10s';
    tipEl.textContent='—';
    document.getElementById('startOverlay').style.display='none';
    document.getElementById('loseOverlay').style.display='none';
    show();
  }

  document.getElementById('btnFake').onclick=()=>answer(false);
  document.getElementById('btnReal').onclick=()=>answer(true);
  document.getElementById('startBtn').onclick=start;
  document.getElementById('retryBtn').onclick=()=>location.reload();

  console.assert(realSamples.length===200,'Debe haber 200 reales');
  console.assert(fakeSamples.length===200,'Debe haber 200 fake');
</script>
</body>
</html>
