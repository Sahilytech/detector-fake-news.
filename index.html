  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Montserrat:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Colores base */
      --black: #000000;
      --white: #ffffff;
      --blue: #0e98d6;
      --yellow: #ffcd02;
      --red: #ff0000;
      --green: #6b8e23;
      --pink: #ff5eb5;

      /* Tema inicial (claro) */
      --bg: var(--white);
      --text: var(--black);
      --accent: var(--blue);
      --accent-soft: #e6f3ff;
      --ok: var(--green);
      --bad: var(--red);
      --glow-ok: 0 0 25px rgba(107,142,35,.8);
      --glow-bad: 0 0 25px rgba(255,0,0,.8);
    }

    body.light-mode {
      --bg: var(--white);
      --text: var(--black);
      --accent-soft: #e6f3ff;
    }

    body.dark-mode {
      --bg: var(--black);
      --text: var(--white);
      --accent-soft: #111111;
    }

    *{box-sizing:border-box;}

    body{
      margin:0;
      font-family:'Press Start 2P', monospace;
      background:var(--bg);
      color:var(--text);
      display:flex;
      justify-content:center;
      min-height:100vh;
      transition: background 0.3s, color 0.3s;
    }

    .screen{
      width:100%;
      max-width:1920px;
      padding:16px;
    }

    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      background:var(--accent-soft);
      padding:14px;
      border-radius:14px;
      font-size:12px;
      transition: background 0.3s;
    }

    .stage{
      display:flex;
      gap:16px;
      margin-top:16px;
      width:100%;
    }

    .play{
      position:relative;
      flex:1;
      background:var(--bg);
      border:3px solid var(--accent);
      border-radius:18px;
      min-height:500px;
      padding:16px;
      transition: background 0.3s;
    }

    .headline{
      position:absolute;
      left:50%;
      top:50%;
      transform:translate(-50%,-50%);
      border:3px solid var(--accent);
      border-radius:16px;
      padding:22px;
      text-align:center;
      width:85%;
      background:var(--bg);
      font-size:15px;
      line-height:1.6;
      transition:.2s, background 0.3s, color 0.3s;
    }

    .timer{
      height:10px;
      margin-top:14px;
      background:#eee;
      border-radius:6px;
      overflow:hidden;
    }

    .timer i{
      display:block;
      height:100%;
      background:linear-gradient(90deg,var(--accent),#0047ab);
    }

    .panel{
      width:340px;
      border:3px solid var(--accent);
      border-radius:18px;
      padding:18px;
      background:var(--bg);
      font-size:11px;
      display:flex;
      flex-direction:column;
      gap:14px;
      transition: background 0.3s, color 0.3s;
    }

    button{
      font-family:'Press Start 2P', monospace;
      padding:16px;
      border:none;
      border-radius:16px;
      width:100%;
      cursor:pointer;
      background:var(--accent);
      color:var(--white);
      transition: background 0.3s, color 0.3s;
    }

    .fakeBtn{background:var(--bad)}

    .overlay{
      position:absolute;
      inset:0;
      background:var(--bg);
      border:3px solid var(--accent);
      border-radius:18px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      transition: background 0.3s, color 0.3s;
    }

    .overlay .title{font-size:20px;margin-bottom:14px}

    #tipText{font-size:12px}

    footer{
      margin-top:14px;
      text-align:center;
      font-size:9px;
      font-family: 'Montserrat', sans-serif;
    }

    /* ===================== */
    /*  PC – 21:9 / Full HD  */
    /* ===================== */
    @media (min-width:1280px) and (min-aspect-ratio:21/9){
      .screen{max-width:1920px}
      .play{min-height:560px}
      .headline{font-size:16px;width:70%}
      .panel{width:360px;font-size:12px}
    }

    /* ===================== */
    /*  CELULAR – 9:16      */
    /* ===================== */
    @media (max-width:720px) and (max-aspect-ratio:9/16){
      header{
        flex-direction:column;
        gap:8px;
        text-align:center;
        font-size:10px;
      }

      .stage{
        flex-direction:column;
      }

      .play{
        min-height:360px;
      }

      .headline{
        font-size:12px;
        width:92%;
        padding:16px;
        line-height:1.4;
      }

      .panel{
        width:100%;
        font-size:10px;
      }

      button{
        padding:14px;
        font-size:10px;
      }
    }

    /* ===================== */
    /*  ROTACIÓN DE CELU    */
    /* ===================== */
    @media (max-width:900px) and (orientation:landscape){
      .stage{flex-direction:row}
      .panel{width:280px}
      .headline{font-size:12px}
    }

    /* Toggle modo oscuro */
    .mode-toggle {
      margin-top:8px;
      display:flex;
      align-items:center;
      gap:0.5em;
      font-size:12px;
      justify-content:center;
    }
    .switch {
      position: relative;
      display: inline-block;
      width:50px;
      height:24px;
    }
    .switch input {display:none;}
    .slider {
      position:absolute;
      cursor:pointer;
      top:0; left:0; right:0; bottom:0;
      background-color: var(--black);
      transition:.4s;
      border-radius:34px;
    }
    .slider:before{
      position:absolute;
      content:"";
      height:18px; width:18px;
      left:3px; bottom:3px;
      background-color: var(--white);
      transition:.4s;
      border-radius:50%;
    }
    input:checked + .slider{
      background-color: var(--blue);
    }
    input:checked + .slider:before{
      transform: translateX(26px);
    }
  </style>
</head>

  const tips = [
  "Los títulos sensacionalistas suelen ser fake",
  "Si suena demasiado increíble, probablemente es fake",
  "Las noticias que prometen poderes mágicos suelen ser falsas",
  "Si nadie más habla de eso, pensá dos veces",

  // ====== Variables del juego ======
  let score = 0;
  let level = 1;
  let timerDuration = 20000; // 10 segundos por nivel
  let timerInterval;
  let currentHeadline = {};
  let gameActive = false;

  // ====== Elementos DOM ======
  const headlineText = document.getElementById('headlineText');
  const bar = document.getElementById('bar');
  const scoreEl = document.getElementById('score');
  const tipText = document.getElementById('tipText');
  const levelText = document.getElementById('levelText');
  const startOverlay = document.getElementById('startOverlay');
  const loseOverlay = document.getElementById('loseOverlay');
  const finalScore = document.getElementById('finalScore');
  const btnFake = document.getElementById('btnFake');
  const btnReal = document.getElementById('btnReal');
  const play = document.getElementById('play');

// ====== Sonidos ======
const soundCorrect = new Audio('https://freesound.org/data/previews/320/320655_5260877-lq.mp3'); // ding
const soundWrong = new Audio('https://freesound.org/data/previews/401/401135_5121236-lq.mp3'); // error

// Volumen alto
soundCorrect.volume = 1; // máximo
soundWrong.volume = 1;   // máximo
  
  // ====== Funciones del juego ======
  function startGame() {
    score = 0;
    level = 1;
    gameActive = true;
    startOverlay.style.display = 'none';
    loseOverlay.style.display = 'none';
    scoreEl.textContent = score;
    nextHeadline();
  }

  function nextHeadline() {
    clearInterval(timerInterval);
    bar.style.width = '100%';

    // Elegir al azar real o fake
    const isReal = Math.random() < 0.5;
    let list = isReal ? realNews : fakeNews;
    const text = list[Math.floor(Math.random() * list.length)];

    // Guardar la noticia actual
    currentHeadline = {
      text: text,
      isReal: isReal
    };

    headlineText.textContent = text;
    tipText.textContent = tips[Math.floor(Math.random() * tips.length)];
    levelText.textContent = `Nivel ${level} — ${timerDuration/1000}s`;

    // Iniciar barra
    const startTime = Date.now();
    timerInterval = setInterval(()=>{
      const elapsed = Date.now() - startTime;
      const pct = Math.max(0, 100 - (elapsed/timerDuration*100));
      bar.style.width = pct + '%';
      if(pct <= 0){
        loseGame();
      }
    }, 50);
  }

  function checkAnswer(isRealBtn){
    if(!gameActive) return;
    clearInterval(timerInterval);
    const correct = (isRealBtn && currentHeadline.isReal) || (!isRealBtn && !currentHeadline.isReal);

    if(correct){
      score++;
      scoreEl.textContent = score;

      // Efecto visual y sonido
      play.style.boxShadow = '0 0 40px rgba(107,142,35,0.9)'; // verde
      soundCorrect.currentTime = 0;
      soundCorrect.play();
      setTimeout(()=>play.style.boxShadow = 'none', 200);

      // Aumenta nivel cada 5 aciertos
      if(score % 5 === 0 && timerDuration > 3000){
        level++;
        timerDuration -= 1000; // más rápido
      }
      nextHeadline();
    } else {
      // Efecto visual y sonido de error
      play.style.boxShadow = '0 0 40px rgba(255,0,0,0.9)'; // rojo
      soundWrong.currentTime = 0;
      soundWrong.play();
      setTimeout(()=>play.style.boxShadow = 'none', 400); // un poco más largo para notar el error
      loseGame();
    }
  }

  function loseGame(){
    gameActive = false;
    clearInterval(timerInterval);
    finalScore.textContent = score;
    loseOverlay.style.display = 'flex';
  }

  // ====== Event listeners ======
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('retryBtn').addEventListener('click', startGame);
  btnFake.addEventListener('click', ()=> checkAnswer(false));
  btnReal.addEventListener('click', ()=> checkAnswer(true));
